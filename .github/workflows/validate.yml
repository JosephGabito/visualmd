name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Format, test, and build
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Validate
        # Release archives are signed on the release machine. CI only needs an
        # ad-hoc signature to verify the macOS bundle without private keys.
        env:
          FLUTTER_XCODE_CODE_SIGN_IDENTITY: "-"
        run: bin/tools/validate.sh
